name: Deploy whisperx align (Cloud Run)

# 當 whisperx_service/(歌詞自動對時容器,aeneas 路線的升級選項)變更
# 時,以 Cloud Build 從原始碼建置並部署到 Cloud Run。也可手動觸發
# (workflow_dispatch)。
#
# 與 aeneas 路線(cloud-run-aeneas-deploy.yml)/ functions 的 Firebase Functions
# 部署互相獨立:兩個對齊容器可並存,由 align_lyrics 的 ALIGN_SERVICE_URL 決定當前
# 採用哪條路線(見 whisperx_service/README.md「如何切換」)。
#
# 只有 push 版本 tag(如 1.0.1)才觸發;push 到 master 不再部署。
# tag push 時 GitHub 不套用 paths 篩選,改由下方 Detect changes 比對「上一個 tag → 本 tag」
# 是否動到 whisperx_service/,沒動到就跳過部署。找不到上一個 tag 或手動觸發 → 一律部署。
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy whisperx-align
    runs-on: ubuntu-latest
    steps:
      # 需要完整歷史與 tags 才能找到上一個 tag 並比對。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          prev=""
          if [ "$EVENT_NAME" = "push" ]; then
            prev=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          fi
          if [ -z "$prev" ]; then
            echo "無上一個 tag 可比對(event=$EVENT_NAME),部署"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$prev" "$GITHUB_SHA" -- whisperx_service/; then
            echo "$prev → $GITHUB_REF_NAME 未變更 whisperx_service/,略過部署"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "$prev → $GITHUB_REF_NAME 變更了 whisperx_service/,部署"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # 沿用 aeneas 路線的部署 SA(具 Cloud Run / Cloud Build / Artifact Registry /
      # Storage 部署權限)。
      - name: Authenticate to Google Cloud
        if: steps.changes.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_RUN_DEPLOY_SA }}

      - name: Set up Cloud SDK
        if: steps.changes.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v2

      # --source 讓 Cloud Build 用 whisperx_service/Dockerfile 建置;
      # 記憶體 / CPU 高於 aeneas(wav2vec2 較重),CPU 推論、無需 GPU。
      - name: Deploy to Cloud Run
        if: steps.changes.outputs.deploy == 'true'
        run: |
          # 各處理流程的版本 = 該流程的程式「最後一次修改」所屬的最早版本 tag(如 1.0.2);
          # 那筆 commit 還沒被任何 tag 涵蓋(手動觸發未發版的 commit)時退回
          # git describe(如 1.0.2-3-gabc1234)。服務把它寫進每份結果的 backendVersion,
          # 該流程改版後舊結果不再沿用;沒動到的流程版本不變、結果照常沿用。
          # 路徑以「排除」方式列出:新增的檔案預設算進流程,不會漏算。
          pipeline_version() {
            commit=$(git log -1 --format=%H "$GITHUB_SHA" -- "$@")
            tag=$(git tag --list '*.*.*' --contains "$commit" --sort=version:refname | head -n 1)
            if [ -n "$tag" ]; then
              echo "$tag"
            else
              git describe --tags --always "$commit"
            fi
          }
          # 不影響輸出的檔案:測試、文件、本機工具。
          common=(
            ':(exclude)whisperx_service/test_*.py'
            ':(exclude)whisperx_service/*.md'
            ':(exclude)whisperx_service/*_local.py'
            ':(exclude)whisperx_service/api_smoke.py'
            ':(exclude)whisperx_service/dev_test.sh'
            ':(exclude)whisperx_service/storage-lifecycle.json'
          )
          # /align 不經過 transcriber.py;/transcribe 會用到 aligner.py(逐段對齊),故全算。
          align_version=$(pipeline_version whisperx_service "${common[@]}" ':(exclude)whisperx_service/transcriber.py')
          transcribe_version=$(pipeline_version whisperx_service "${common[@]}")
          echo "whisperx.align=$align_version whisperx.transcribe=$transcribe_version"
          # 用 --update-env-vars(合併),不要用 --set-env-vars(會清掉其他環境變數)。
          gcloud run deploy whisperx-align \
            --source whisperx_service \
            --project seek-player-f724e \
            --region asia-east1 \
            --memory 8Gi \
            --cpu 4 \
            --concurrency 1 \
            --timeout 600 \
            --no-allow-unauthenticated \
            --update-env-vars "ALIGN_PIPELINE_VERSION=$align_version,TRANSCRIBE_PIPELINE_VERSION=$transcribe_version" \
            --quiet
