name: Deploy aeneas align (Cloud Run)

# 當 aeneas_service/(歌詞自動對時容器)變更時,
# 以 Cloud Build 從原始碼建置並部署到 Cloud Run。
# 也可在 Actions 頁手動觸發(workflow_dispatch)。
#
# 與 functions/ 的 Firebase Functions 部署互相獨立(見
# firebase-functions-deploy.yml);aeneas 需 espeak/ffmpeg 系統依賴,走自架容器。
#
# 只有 push 版本 tag(如 1.0.1)才觸發;push 到 master 不再部署。
# tag push 時 GitHub 不套用 paths 篩選,改由下方 Detect changes 比對「上一個 tag → 本 tag」
# 是否動到 aeneas_service/,沒動到就跳過部署。找不到上一個 tag 或手動觸發 → 一律部署。
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy aeneas-align
    runs-on: ubuntu-latest
    steps:
      # 需要完整歷史與 tags 才能找到上一個 tag 並比對。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          prev=""
          if [ "$EVENT_NAME" = "push" ]; then
            prev=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          fi
          if [ -z "$prev" ]; then
            echo "無上一個 tag 可比對(event=$EVENT_NAME),部署"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$prev" "$GITHUB_SHA" -- aeneas_service/; then
            echo "$prev → $GITHUB_REF_NAME 未變更 aeneas_service/,略過部署"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "$prev → $GITHUB_REF_NAME 變更了 aeneas_service/,部署"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # 部署前先跑完全部單元測試(兩個服務都跑),失敗就不部署。
      - name: Run all tests
        if: steps.changes.outputs.deploy == 'true'
        uses: ./.github/actions/run-tests

      # 認證用的 service account 需具備 Cloud Run / Cloud Build / Artifact
      # Registry / Storage(讀部署用 GCS)等部署權限。可沿用既有
      # FIREBASE_SERVICE_ACCOUNT_* secret 並補授權,或另設一組部署專用 SA。
      - name: Authenticate to Google Cloud
        if: steps.changes.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_RUN_DEPLOY_SA }}

      - name: Set up Cloud SDK
        if: steps.changes.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v2

      # --source 讓 Cloud Build 用 aeneas_service/Dockerfile 建置;
      # 記憶體 / CPU / 逾時對齊 README 的部署建議。
      - name: Deploy to Cloud Run
        if: steps.changes.outputs.deploy == 'true'
        run: |
          # 各處理流程的版本 = 該流程的程式「最後一次修改」所屬的最早版本 tag(如 1.0.2);
          # 那筆 commit 還沒被任何 tag 涵蓋(手動觸發未發版的 commit)時退回
          # git describe(如 1.0.2-3-gabc1234)。服務把它寫進每份結果的 backendVersion,
          # 該流程改版後舊結果不再沿用;沒動到的流程版本不變、結果照常沿用。
          # 路徑以「排除」方式列出:新增的檔案預設算進流程,不會漏算。
          pipeline_version() {
            commit=$(git log -1 --format=%H "$GITHUB_SHA" -- "$@")
            tag=$(git tag --list '*.*.*' --contains "$commit" --sort=version:refname | head -n 1)
            if [ -n "$tag" ]; then
              echo "$tag"
            else
              git describe --tags --always "$commit"
            fi
          }
          align_version=$(pipeline_version aeneas_service \
            ':(exclude)aeneas_service/test_*.py' \
            ':(exclude)aeneas_service/*.md' \
            ':(exclude)aeneas_service/storage-lifecycle.json')
          echo "aeneas.align=$align_version"
          # 用 --update-env-vars(合併),不要用 --set-env-vars(會清掉其他環境變數)。
          gcloud run deploy aeneas-align \
            --source aeneas_service \
            --project seek-player-f724e \
            --region asia-east1 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 600 \
            --no-allow-unauthenticated \
            --update-env-vars "ALIGN_PIPELINE_VERSION=$align_version" \
            --quiet
